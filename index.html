

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2 class="logo">MyWebsite</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Welcome to My Website</h1>
        <p>Create something amazing with HTML, CSS and JavaScript.</p>
        <button onclick="showMessage()">Get Started</button>
    </section>

    <section id="about">
        <h2>About Us</h2>
        <p>We create beautiful and modern websites for everyone.</p>
    </section>

    <section id="services">
        <h2>Our Services</h2>
        <div class="services">
            <div class="card">Web Design</div>
            <div class="card">Web Development</div>
            <div class="card">Digital Solutions</div>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <input type="text" id="name" placeholder="Enter your name">
        <input type="email" placeholder="Enter your email">
        <button onclick="sendMessage()">Submit</button>
    </section>

    <footer>
        <p>© 2026 MyWebsite. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
